<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9ec0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mon Carnet de Budget</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#fff1ee;--dot:#ffd3dc;--card:#fffaf6;--ink:#4a2b3a;--mut:#8f6b7b;--track:#f8e1e6;--ac:#ff7aa8;--bad:#e5484d;--warn:#f5a524;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231720;--dot:#33222d;--card:#34222f;--ink:#ffe9f1;--mut:#c9a7b6;--track:#4b3443;--ac:#ff8db6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231720;--dot:#33222d;--card:#34222f;--ink:#ffe9f1;--mut:#c9a7b6;--track:#4b3443;--ac:#ff8db6;color-scheme:dark}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.8px);background-size:20px 20px;color:var(--ink);font:16px/1.4 Fredoka,Nunito,"Segoe UI",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 16px 110px}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
h1{font-size:30px;line-height:1.1;margin:6px 0 0;font-weight:600}
h1.pf{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600}
.note{font-family:Caveat,"Bradley Hand","Segoe Print",cursive;font-size:21px;color:var(--mut)}
.snd{border:2.5px solid var(--ink);background:var(--card);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
.stk{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--ink);padding:14px;margin:14px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:30px;font-weight:600}.sm{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{border:2px dashed var(--ink);border-radius:12px;padding:7px 8px;display:flex;flex-direction:column}
.stats b{font-size:15px}.stats span{font-size:11px;color:var(--mut)}
.neg{color:var(--bad)}
.stack{display:flex;height:16px;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--track)}
.stack i{display:block;height:100%;border-right:2px solid var(--ink)}
.bar{height:16px;border:2.5px solid var(--ink);border-radius:99px;background:var(--track);overflow:hidden;margin:9px 0 6px}
.bar i{display:block;height:100%;transition:width .6s;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.4) 0 6px,transparent 6px 12px)}
.t{font-weight:600;font-size:17px}.pc{font-family:Caveat,cursive;font-size:30px;line-height:1}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:2.5px solid var(--ink);background:var(--ac);color:#4a2b3a;padding:8px 15px;border-radius:99px;font:inherit;font-weight:600;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink)}.btn.danger{background:var(--bad);color:#fff}.btn.full{width:100%;margin-top:10px}
nav{position:fixed;left:12px;right:12px;bottom:10px;max-width:536px;margin:0 auto;display:flex;background:var(--card);border:2.5px solid var(--ink);border-radius:24px;box-shadow:3px 3px 0 var(--ink);padding:5px 5px calc(5px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:6px;border-radius:18px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
nav button b{font-size:20px;font-weight:400}
nav button.on{background:var(--ac);color:#4a2b3a;font-weight:600}
.back{border:0;background:none;color:var(--ink);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
.themed{border:2.5px solid #4a2b3a;border-radius:26px;padding:16px;color:#4a2b3a;box-shadow:4px 4px 0 #4a2b3a;margin:12px 0}
.themed.k{background-image:linear-gradient(90deg,rgba(255,255,255,.5) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.5) 50%,transparent 50%);background-size:30px 30px}
.themed.r{background-image:radial-gradient(circle at 15% 10%,rgba(255,255,255,.7),transparent 45%),radial-gradient(circle at 90% 85%,rgba(120,140,190,.18),transparent 50%)}
.themed .note{color:#6b4a5a}
.scard{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px}
.scard:nth-child(odd){transform:rotate(-.7deg)}.scard:nth-child(even){transform:rotate(.6deg)}
.mini{width:92px;flex:none}.si{flex:1;min-width:0}.gt{font-weight:600;font-size:17px}.pp{font-family:Caveat,cursive;font-size:30px}
.pigbox{position:relative;max-width:270px;margin:6px auto}
.pig{width:100%;display:block;animation:float 3.2s ease-in-out infinite;transform-origin:50% 90%;cursor:pointer}
.mini .pig{animation:none}
@keyframes float{50%{transform:translateY(-5px)}}
.pig.squish{animation:squish .6s}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.12,.86)}60%{transform:scale(.94,1.08)}100%{transform:scale(1)}}
.pig.shake{animation:shake .6s}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.lvl{transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
.coin{position:absolute;left:51%;top:-6px;width:26px;height:26px;border-radius:50%;background:#ffd666;border:3px solid #4a2b3a;box-shadow:inset -3px -3px 0 #f1b72e;animation:drop .75s ease-in both;z-index:2}
@keyframes drop{0%{transform:translate(-50%,-20px);opacity:0}15%{opacity:1}50%{transform:translate(-50%,22px) scaleX(.25)}100%{transform:translate(-50%,66px) scale(.6);opacity:0}}
.fx{position:absolute;bottom:45%;font-size:22px;color:#ff5c8a;pointer-events:none;animation:rise 1.5s ease-out both;z-index:3}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-120px) scale(1.2);opacity:0}}
.name{font-size:26px;font-weight:600;text-align:center;margin:6px 0 0}
.amt{text-align:center;font-size:18px}
.quick{display:flex;gap:8px;margin:12px 0 8px}.quick .btn{flex:1}
input{width:100%;padding:10px 12px;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb{font-size:13px;color:var(--mut);margin:12px 0 6px}
.pk{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;background:var(--track);color:var(--ink);border-radius:12px;padding:5px 9px;font-size:17px;cursor:pointer}
.sw{width:38px;height:38px;border-radius:50%;border:2.5px solid #4a2b3a;cursor:pointer}
.chip.on,.sw.on{box-shadow:0 0 0 3px var(--ac)}
input[type=checkbox]{width:24px;height:24px;margin:0;accent-color:var(--ac)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);margin:12px 0}
.tag{display:inline-block;margin-top:6px;border:2px dashed var(--ink);border-radius:99px;padding:1px 10px;font-size:12px}
.pav{border-radius:50%;object-fit:cover;border:2.5px solid var(--ink);display:block}
.pav.ph{display:grid;place-items:center;background:var(--ac);color:#4a2b3a;font-weight:600}
.prof{text-align:center}.pavw{display:flex;justify-content:center;margin-bottom:6px}
.rk{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:2px dotted rgba(128,128,128,.4)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.cap{text-transform:capitalize}
textarea{width:100%;padding:10px 12px;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:13px ui-monospace,Menlo,monospace;margin-top:8px}
.stg{display:block;margin:0 auto}.stg.off path{fill:none;stroke-dasharray:7 6}.stg.off{opacity:.5}
.sgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.sst{text-align:center;width:78px;font-size:11px;line-height:1.2}
.sst:nth-child(3n){transform:rotate(-5deg)}.sst:nth-child(3n+1){transform:rotate(4deg)}
.sst svg:not(.off){animation:pop2 .5s both}
@keyframes pop2{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.15) rotate(8deg)}100%{transform:none}}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:99px;padding:8px 16px;z-index:30;font-weight:600;max-width:90%;text-align:center}
.wr{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.wtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}.wbars{flex:1;display:flex;gap:5px}.wbars i{flex:1;height:5px;border-radius:9px;background:rgba(128,128,128,.35)}.wbars i.on{background:var(--ink)}
.ws{flex:1;border:2.5px solid #4a2b3a;border-radius:28px;box-shadow:4px 4px 0 #4a2b3a;color:#4a2b3a;display:grid;place-items:center;text-align:center;padding:20px;overflow:auto}
.wi{width:100%;animation:wpop .6s both}
@keyframes wpop{0%{transform:scale(.85) translateY(24px);opacity:0}100%{transform:none;opacity:1}}
.wbig{font-size:50px;font-weight:600;line-height:1.05;margin:6px 0}.wsub{font-family:Caveat,cursive;font-size:28px;line-height:1.1}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:2px dotted rgba(74,43,58,.35);font-size:18px;text-align:left}
.wnav{display:flex;gap:10px;margin-top:12px}.wnav .btn{flex:1}
.ov{position:fixed;inset:0;background:rgba(40,15,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;border:2.5px solid var(--ink);border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:21px}
.log{margin-top:12px}.log div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:2px dotted rgba(74,43,58,.35);font-size:14px}
.empty{text-align:center;padding:30px 10px}
.pcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;margin:12px 0;color:#2a2320;box-shadow:0 8px 22px rgba(60,30,20,.16);cursor:pointer;border:1px solid rgba(255,255,255,.7)}
.ring{border-radius:50%;padding:4px;flex:none;width:68px;height:68px}
.ring .av{width:100%;height:100%;border-radius:50%;background:#fffaf4;display:grid;place-items:center;font-size:28px;border:3px solid #fffaf4}
.ring.big{width:128px;height:128px;margin:6px auto;padding:6px}.ring.big .av{font-size:52px}
.ring.pop{animation:pop .7s}
@keyframes pop{30%{transform:scale(1.14) rotate(-4deg)}60%{transform:scale(.96) rotate(3deg)}}
.pi{flex:1;min-width:0}.pn{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:20px;font-weight:600}.ps{font-size:13px;opacity:.75}
.pg{font-family:"Playfair Display",Georgia,serif;font-size:22px;font-weight:600}
.proc{position:relative;border-radius:30px;padding:20px 16px;color:#2a2320;box-shadow:0 14px 34px rgba(60,30,20,.2);margin:10px 0;text-align:center}
.pname{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:30px;font-weight:600}
.phandle{font-size:13px;opacity:.7;letter-spacing:.04em}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 10px}
.pstats b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:24px}.pstats span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.pbar{height:8px;border-radius:9px;background:rgba(0,0,0,.1);overflow:hidden}.pbar i{display:block;height:100%;border-radius:9px;transition:width .8s}
.pbtn{border:0;background:#2a2320;color:#f3d9a4;border-radius:99px;padding:10px 16px;font:inherit;font-weight:500;cursor:pointer;flex:1}
.pbtn.g{background:#fffaf4;color:#2a2320}
.proc input{background:#fffaf4;color:#2a2320;border:1px solid rgba(0,0,0,.15)}
.proc .log div{border-color:rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.pig,.ring.pop{animation:none}}
</style></head>
<body><main id="app"></main><nav id="nav"></nav>
<script>
const KEY='budget-planner-v1';
const SAVE=[{n:'Kawaii rose',a:'#ff9ec0',s:'#ffe1ec',bow:'#e63946',mood:'k'},{n:'Vanille',a:'#ffe08a',s:'#fff6d6',bow:'#ff8fa3',mood:'k'},{n:'Menthe',a:'#9be3d0',s:'#dcf6ee',bow:'#ff8fa3',mood:'k'},{n:'Rêverie bleue',a:'#a9c1e6',s:'#e2ebf8',mood:'r',tear:'#6fa8dc'},{n:'Brume lilas',a:'#c9b6e8',s:'#efe8fa',mood:'r',tear:'#8e7cc3'},{n:'Sauge',a:'#b7cdb0',s:'#e8f1e4',mood:'r',tear:'#7aa58a'}];
const PRO=[{n:'Champagne',a:'#b98a3e',s:'#fbf1e0',g:'#e8c987'},{n:'Rose nude',a:'#c4706f',s:'#fbe6e1',g:'#f1b9b0'},{n:'Noir et or',a:'#1f1b1a',s:'#efe9df',g:'#c9a35b'},{n:'Pêche glam',a:'#d9693a',s:'#ffe8da',g:'#f6b98f'}];
const CAT=['#ff8fb1','#7fd1c7','#ffd166','#a5b4fc','#ffb085','#b6e388','#d4a5ff','#8fd3f4','#f4a261','#c7e9b4'];
const PRESETS=[{name:'Maquillage',emoji:'💄',budget:40},{name:'Vêtements',emoji:'👗',budget:80},{name:'Restaurants',emoji:'🍽️',budget:70},{name:'Café & snacks',emoji:'🧋',budget:30},{name:'Beauté & soins',emoji:'💅',budget:40},{name:'Sorties',emoji:'🥂',budget:60},{name:'Shopping en ligne',emoji:'📦',budget:50},{name:'Abonnements',emoji:'📱',budget:25},{name:'Cadeaux',emoji:'🎁',budget:30},{name:'Santé',emoji:'💊',budget:20}];
const EMOJIS=['🎯','✈️','🏠','🚗','💍','🎓','💻','🌴','🛍️','🐶','📈','🤝','💼','🚀','🎁','📸'];
const th=g=>{const L=g.kind==='save'?SAVE:PRO;return L[(g.theme||0)%L.length]};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n||0);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const uid=()=>Math.random().toString(36).slice(2,8);
const fmtG=(g,n)=>g.kind==='save'||g.unit==='€'?eur(n):`${(+n).toLocaleString('fr-FR')} ${esc(g.unit)}`;
function seed(){return{sound:true,income:1800,cats:[
{id:'c1',name:'Logement',emoji:'🏠',budget:650,spent:0,auto:true,day:1},{id:'c2',name:'Courses',emoji:'🛒',budget:250,spent:120},
{id:'c3',name:'Transport',emoji:'🚆',budget:80,spent:35},{id:'c4',name:'Restaurants',emoji:'🍽️',budget:70,spent:45},{id:'c6',name:'Vêtements',emoji:'👗',budget:80,spent:60},{id:'c7',name:'Maquillage',emoji:'💄',budget:40,spent:35},{id:'c8',name:'Sorties',emoji:'🥂',budget:60,spent:20},{id:'c5',name:'Épargne',emoji:'🐷',budget:300,spent:0}],
goals:[{id:'g1',kind:'save',name:'Voyage de rêve',emoji:'✈️',theme:0,current:600,target:2000,unit:'€',deadline:'',log:[]},
{id:'g2',kind:'pro',name:'Obtenir 10 clients',emoji:'🤝',theme:0,current:3,target:10,unit:'clients',deadline:'',log:[]}]}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d.sound===undefined)d.sound=true;return d}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),view={tab:'budget',goal:null,from:null};
const commit=()=>{save();render()};
const val=(m,n)=>m.querySelector('[name='+n+']').value;
const pick=(m,k)=>{const x=m.querySelector('[data-pick="'+k+'"].on');return x?x.dataset.v:null};
const autoDue=c=>{const d=new Date(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()>=Math.min(c.day||1,last)};
const spentOf=c=>(c.spent||0)+(c.auto&&autoDue(c)?c.budget:0);

/* sons */
let AC;
function tone(f,t0,d,type,vol,f2){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const clink=()=>{tone(1318,0,.12,'triangle',.2);tone(1760,.06,.2,'triangle',.15)};
const oink=()=>{tone(230,0,.16,'sawtooth',.1,130);tone(200,.18,.12,'sawtooth',.08,120)};
const sad=()=>{tone(420,0,.2,'sine',.15,260);tone(310,.2,.26,'sine',.15,180)};
const fan=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.28,'triangle',.18));
const chime=()=>{tone(1046,0,.3,'sine',.15);tone(1568,.1,.45,'sine',.12)};

/* animations */
function fx(box,sym,n){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='fx';s.textContent=sym;s.style.left=(15+Math.random()*70)+'%';s.style.setProperty('--dx',(Math.random()*70-35)+'px');s.style.animationDelay=(i*90)+'ms';box.appendChild(s);setTimeout(()=>s.remove(),1900)}}
function coins(box,n,done){for(let i=0;i<n;i++){const c=document.createElement('span');c.className='coin';c.style.animationDelay=(i*140)+'ms';box.appendChild(c);setTimeout(clink,i*140+520);setTimeout(()=>c.remove(),i*140+900)}setTimeout(done,n*140+560)}
function celebrate(g,v,reached){
 if(g.kind==='save'){const box=$('.pigbox'),pig=$('.pig');if(!box)return;
  if(v>0)coins(box,Math.min(7,Math.max(2,Math.ceil(v/15))),()=>{pig.classList.add('squish');oink();fx(box,'♥',6);if(reached){fan();fx(box,'✨',10)}setTimeout(()=>pig.classList.remove('squish'),700)});
  else{pig.classList.add('shake');sad();setTimeout(()=>pig.classList.remove('shake'),700)}}
 else{const box=$('.proc'),r=$('.ring.big');if(!box)return;
  if(v>0){r.classList.add('pop');chime();fx(box,'✨',7);if(reached){setTimeout(fan,300);fx(box,'🎉',6)}}else sad()}}
function adjust(g,v){if(!v)return;const old=pct(g.current,g.target),was=g.current>=g.target,n0=S.goals.filter(x=>goalStar(x,mk())).length;
 g.current=Math.max(0,Math.round((g.current+v)*100)/100);g.log.unshift({d:ld(),v});g.log=g.log.slice(0,400);markReach(g);
 save();view.from=old;render();const lv=$('.lvl');
 if(lv)requestAnimationFrame(()=>requestAnimationFrame(()=>{lv.style.transform=`translateY(${(1-Math.min(100,pct(g.current,g.target))/100)*110}px)`}));
 celebrate(g,v,!was&&g.current>=g.target);if(S.goals.filter(x=>goalStar(x,mk())).length>n0)setTimeout(()=>{toast('⭐ Nouvelle étoile : '+g.name);fan()},1300)}

/* tirelire (personnage original) */
function pig(T,p,id,from){const y=(1-Math.min(100,from!=null?from:p)/100)*110,r=T.mood==='r',K='#4a2b3a';
 const eye=r?`<path d="M58 80 q8 6 16 0" fill="none" stroke="${K}" stroke-width="4" stroke-linecap="round"/><path d="M66 88 q-5 9 0 13 q5-4 0-13z" fill="${T.tear}" stroke="${K}" stroke-width="2"/>`:`<ellipse cx="68" cy="82" rx="5" ry="6.5" fill="${K}"/><circle cx="66" cy="80" r="1.8" fill="#fff"/><ellipse cx="58" cy="98" rx="8" ry="5" fill="#ff8fa3" opacity=".75"/>`;
 const bow=r?'':`<g transform="translate(80 38)" stroke="${K}" stroke-width="3" stroke-linejoin="round" fill="${T.bow}"><path d="M0 0L-16-10V10Z"/><path d="M0 0L16-10V10Z"/><circle r="5"/></g>`;
 return `<svg class="pig" data-act="poke" viewBox="0 0 200 170" role="img" aria-label="Tirelire"><defs><clipPath id="cp${id}"><ellipse cx="100" cy="95" rx="70" ry="55"/></clipPath></defs>
<path d="M168 92q22-8 11-25-6-8-14 0" fill="none" stroke="${K}" stroke-width="4" stroke-linecap="round"/>
<rect x="52" y="132" width="26" height="28" rx="10" fill="${T.a}" stroke="${K}" stroke-width="4"/><rect x="122" y="132" width="26" height="28" rx="10" fill="${T.a}" stroke="${K}" stroke-width="4"/>
<path d="M62 58L52 24L90 44Z" fill="${T.a}" stroke="${K}" stroke-width="4" stroke-linejoin="round"/>
<ellipse cx="100" cy="95" rx="70" ry="55" fill="${T.a}"/>
<g clip-path="url(#cp${id})"><rect class="lvl" x="20" y="40" width="160" height="110" fill="#ffd666" opacity=".88" style="transform:translateY(${y}px)"/></g>
<ellipse cx="100" cy="95" rx="70" ry="55" fill="none" stroke="${K}" stroke-width="4"/>
<rect x="86" y="40" width="30" height="8" rx="4" fill="${K}"/>
<ellipse cx="26" cy="101" rx="16" ry="13" fill="#fff" fill-opacity=".6" stroke="${K}" stroke-width="4"/><circle cx="21" cy="101" r="2.5" fill="${K}"/><circle cx="31" cy="101" r="2.5" fill="${K}"/>${eye}${bow}</svg>`}

/* étoiles + wrapped */
function mk(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const ld=()=>{const d=new Date();return mk(d)+'-'+String(d.getDate()).padStart(2,'0')};
const isLast=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()===d.getDate()};
const mLabel=k=>new Date(k+'-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const mProg=(g,k)=>Math.max(0,(g.log||[]).filter(l=>l.d.slice(0,7)===k).reduce((a,l)=>a+l.v,0));
const goalStar=(g,k)=>(g.monthly>0&&mProg(g,k)>=g.monthly)||g.reachedIn===k;
function markReach(g){if(g.target>0&&g.current>=g.target){if(!g.reachedIn)g.reachedIn=mk()}else g.reachedIn=''}
const lv=n=>n<1?'ciel encore vide…':n<3?'petite étoile':n<7?'étoile filante':n<15?'constellation':'voie lactée ✨';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
function star(c,e,sz,on){return `<svg class="stg ${on?'':'off'}" width="${sz}" height="${sz}" viewBox="0 0 100 100"><path d="M50 6L63 34L94 38L71 59L77 90L50 75L23 90L29 59L6 38L37 34Z" fill="${c}" stroke="#4a2b3a" stroke-width="5" stroke-linejoin="round"/><text x="50" y="62" text-anchor="middle" font-size="26">${e}</text></svg>`}
function monthLine(g){if(!(g.monthly>0))return '';const k=mk(),v=mProg(g,k);return `<div style="font-size:13px;color:#5a4350;margin-top:10px">⭐ Ce mois-ci : ${fmtG(g,v)} / ${fmtG(g,g.monthly)}${goalStar(g,k)?' · étoile gagnée !':''}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.min(100,pct(v,g.monthly))}%;background-color:${th(g).a}"></i></div>`}
function starsOf(k,d){const r=[];S.goals.forEach(g=>{if(goalStar(g,k))r.push({c:g.reachedIn===k?'#ffd666':th(g).a,e:g.emoji,n:g.name})});const h=d||(S.hist&&S.hist[k]);if(h&&h.zen)r.push({c:'#b6e388',e:'🍃',n:'Budget zen'});return r}
function months(){const s=new Set([mk()]);Object.keys(S.hist||{}).forEach(k=>s.add(k));S.goals.forEach(g=>{(g.log||[]).forEach(l=>s.add(l.d.slice(0,7)));if(g.reachedIn)s.add(g.reachedIn)});return [...s].sort().reverse()}
function snap(k,full){const sp=c=>full?(c.spent||0)+(c.auto?c.budget:0):spentOf(c),tot=S.cats.reduce((a,c)=>a+sp(c),0);
 return{income:S.income,spent:tot,cats:S.cats.map(c=>({n:c.name,e:c.emoji,b:c.budget,s:sp(c)})),zen:tot>0&&S.cats.every(c=>sp(c)<=c.budget)&&tot<=S.income,saved:S.goals.filter(g=>g.kind==='save').reduce((a,g)=>a+mProg(g,k),0),pro:S.goals.filter(g=>g.kind==='pro').map(g=>({n:g.name,e:g.emoji,v:mProg(g,k),u:g.unit})).filter(x=>x.v>0)}}
function rollover(){const cur=mk();if(!S.month){S.month=cur;save();return null}if(S.month===cur)return null;const k=S.month;S.hist=S.hist||{};S.hist[k]=snap(k,true);S.cats.forEach(c=>c.spent=0);S.month=cur;save();return k}
function vStars(){const cur=mk();let tot=0;
 const cards=months().map(k=>{const st=starsOf(k);tot+=st.length;const miss=S.goals.filter(g=>g.monthly>0&&!goalStar(g,k)),z=k===cur&&!(S.hist&&S.hist[k]);
  const sl=st.map(s=>`<div class="sst">${star(s.c,s.e,64,1)}<div>${esc(s.n)}</div></div>`).join('')+miss.map(g=>`<div class="sst">${star(th(g).a,g.emoji,64,0)}<div>${k===cur?fmtG(g,mProg(g,k))+' / '+fmtG(g,g.monthly):esc(g.name)}</div></div>`).join('')+(z?`<div class="sst">${star('#b6e388','🍃',64,0)}<div>Budget zen</div></div>`:'');
  return `<div class="stk"><div class="t cap">${mLabel(k)}</div><div class="sgrid">${sl||'<div class="note">Pas encore d’étoile ce mois-ci…</div>'}</div></div>`}).join('');
 return `${head('Mes étoiles','mon sticker book')}<div class="stk prof"><div class="big">⭐ ${tot}</div><div class="note">${lv(tot)}</div><div class="acts" style="justify-content:center"><button class="btn" data-act="wrap">✨ Voir le wrapped du mois</button></div></div>${cards}<div class="note" style="text-align:center">1 étoile = un objectif du mois atteint, un objectif complété ou un mois sans dépassement de budget</div>`}
function wrapSlides(k,d){const p=prof(),st=starsOf(k,d),top=[...d.cats].filter(c=>c.s>0).sort((a,b)=>b.s-a.s).slice(0,3),g=S.goals.find(x=>x.kind==='save'),T=g?th(g):SAVE[0];
 const bgs=['#ffd6e7','#ffe9b8','#d8f1e6','#e3dcf8','#ffd9c7','#d6e6fb','#ffd6e7'];
 const H=[
 `<div class="wsub">ton mois de</div><div class="wbig cap">${mLabel(k)}</div>${p.photo||p.name?`<div class="pavw" style="margin:10px 0">${avatar(96)}</div>`:''}<div class="wsub">${p.name?esc(p.name)+', voici':'voici'} ton récap ✨</div>`,
 `<div class="wsub">tu as dépensé</div><div class="wbig">${eur(d.spent)}</div><div class="wsub">sur ${eur(d.income)} de revenu · ${pct(d.spent,d.income)} %</div><div class="bar" style="margin:14px 0"><i style="width:${Math.min(100,pct(d.spent,d.income))}%;background-color:#ff8fb1"></i></div><div class="wsub">${d.spent<=d.income?'il te reste '+eur(d.income-d.spent)+' 💕':'tu as dépassé de '+eur(d.spent-d.income)}</div>`,
 `<div class="wsub">ce qui t’a fait le plus dépenser</div>${top.length?top.map((c,i)=>`<div class="wrow"><span>${i===0?'🔥 ':''}${esc(c.e)} ${esc(c.n)}</span><b>${pct(c.s,d.spent)} %</b></div>`).join(''):'<div class="wbig">rien !</div>'}`,
 `<div class="wsub">mis de côté</div><div class="wbig">${eur(d.saved)}</div><div class="pigbox" style="max-width:200px">${pig(T,g?pct(g.current,g.target):0,'w')}</div>`,
 `<div class="wsub">côté pro</div>${d.pro.length?d.pro.map(x=>`<div class="wrow"><span>${esc(x.e)} ${esc(x.n)}</span><b>+${(+x.v).toLocaleString('fr-FR')} ${esc(x.u)}</b></div>`).join(''):'<div class="wbig" style="font-size:30px">pas de progrès ce mois-ci, le prochain sera le bon 💪</div>'}`,
 `<div class="wsub">tes étoiles du mois</div><div class="wbig">⭐ ${st.length}</div><div class="sgrid" style="justify-content:center">${st.map(s=>`<div class="sst">${star(s.c,s.e,64,1)}<div>${esc(s.n)}</div></div>`).join('')}</div>`,
 `<div class="wbig" style="font-size:40px">à très vite ✨</div><div class="wsub">un nouveau mois, de nouvelles étoiles</div>`];
 return H.map((h,i)=>({h,bg:bgs[i]}))}
function showWrapped(k,d){const sl=wrapSlides(k,d),ns=starsOf(k,d).length;let i=0;const o=document.createElement('div');o.className='wr';
 const draw=()=>{o.innerHTML=`<div class="wtop"><div class="wbars">${sl.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><button class="snd" data-w="x" aria-label="Fermer">✕</button></div><div class="ws" style="background:${sl[i].bg}"><div class="wi">${sl[i].h}</div></div><div class="wnav"><button class="btn ghost" data-w="p">‹</button><button class="btn" data-w="n">${i<sl.length-1?'Suivant ›':'Fermer'}</button></div>`};
 o.addEventListener('click',e=>{const w=e.target.dataset.w;if(!w)return;
  if(w==='x'||(w==='n'&&i===sl.length-1)){o.remove();return}
  if(w==='n'){i++;draw();if(i===5&&ns)fan();else chime()}else if(i>0){i--;draw()}});
 document.body.appendChild(o);draw()}
/* profil + analyse des dépenses */
function prof(){return S.profile||(S.profile={name:'',handle:'',bio:'',photo:''})}
function avatar(sz){const p=prof();return p.photo?`<img class="pav" style="width:${sz}px;height:${sz}px" src="${p.photo}" alt="Photo de profil">`:`<div class="pav ph" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz/2)}px">${esc((p.name||'🧸').slice(0,1).toUpperCase())}</div>`}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-w)/2,(im.height-w)/2,w,w,0,0,256,256);cb(c.toDataURL('image/jpeg',.82))};im.onerror=()=>cb(null);im.src=r.result};r.onerror=()=>cb(null);r.readAsDataURL(f)}
function profForm(p){return `<label>Prénom<input name="name" value="${esc(p.name)}"></label><label>Pseudo (sans @)<input name="handle" value="${esc(p.handle)}"></label><label>Petite phrase<input name="bio" value="${esc(p.bio)}"></label><label>Photo de profil<input type="file" accept="image/*" name="photo"></label>${p.photo?'<label class="chk"><input type="checkbox" name="rmphoto"> Retirer ma photo</label>':''}`}
function vProfile(){const p=prof(),sv=S.goals.filter(g=>g.kind==='save'),pr=S.goals.filter(g=>g.kind==='pro');
 return `${head('Mon profil','tout sur moi')}
<div class="stk prof"><div class="pavw">${avatar(110)}</div><div class="name">${esc(p.name)||'Ton prénom'}</div>${p.handle?`<div class="sm">@${esc(p.handle)}</div>`:''}${p.bio?`<div class="note">${esc(p.bio)}</div>`:''}<div class="acts" style="justify-content:center"><button class="btn" data-act="editprof">Modifier mon profil</button></div></div>
<div class="stk"><div class="stats"><div><b>${eur(S.income)}</b><span>revenu</span></div><div><b>${eur(sv.reduce((a,g)=>a+g.current,0))}</b><span>de côté</span></div><div><b>${pr.filter(g=>g.current>=g.target).length}/${pr.length}</b><span>objectifs pro</span></div></div></div><button class="btn ghost full" data-act="backup">💾 Sauvegarder / transférer mes données</button>`}
function vSpend(){const tot=S.cats.reduce((a,c)=>a+spentOf(c),0);if(!tot)return '';
 const L=S.cats.map((c,i)=>({c,i,v:spentOf(c)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 return `<div class="stk"><div class="row"><div class="t">Où part mon argent ?</div><div class="pc">${eur(tot)}</div></div><div class="note">${esc(L[0].c.name)} est ton plus gros poste : ${pct(L[0].v,tot)} % de tes dépenses</div>
<div class="stack" style="margin:8px 0">${L.map(x=>`<i style="width:${x.v/tot*100}%;background:${CAT[x.i%CAT.length]}"></i>`).join('')}</div>
${L.map((x,k)=>`<div class="rk"><span class="dot" style="background:${CAT[x.i%CAT.length]}"></span><span>${k===0?'🔥 ':''}${esc(x.c.emoji)} ${esc(x.c.name)}</span><b>${pct(x.v,tot)} %</b><span class="sm">${eur(x.v)}</span></div>`).join('')}</div>`}
/* vues */
const head=(t,sub,c)=>`<div class="head"><div><h1 class="${c||''}">${t}</h1><div class="note">${sub}</div></div><div class="row" style="gap:8px">${prof().photo||prof().name?`<span data-act="tab" data-t="me" style="cursor:pointer">${avatar(42)}</span>`:''}<button class="snd" data-act="snd" aria-label="Son">${S.sound?'🔔':'🔕'}</button></div></div>`;
function vBudget(){const tb=S.cats.reduce((a,c)=>a+c.budget,0),ts=S.cats.reduce((a,c)=>a+spentOf(c),0),au=S.cats.filter(c=>c.auto);
 const month=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
 return `${head('Mon budget',(prof().name?esc(prof().name)+' · ':'')+month)}
<div class="stk"><div class="row"><div><div class="sm">Revenu du mois</div><div class="big">${eur(S.income)}</div></div><button class="btn ghost" data-act="income">Modifier</button></div>
<div class="stats"><div><b>${eur(tb)}</b><span>Budgété (${pct(tb,S.income)} %)</span></div><div><b>${eur(ts)}</b><span>Dépensé</span></div><div><b class="${S.income-ts<0?'neg':''}">${eur(S.income-ts)}</b><span>Reste</span></div></div>
<div class="stack">${S.cats.map((c,i)=>`<i style="width:${Math.min(100,c.budget/(S.income||1)*100)}%;background:${CAT[i%CAT.length]}"></i>`).join('')}</div>
<div class="note">où part mon revenu${au.length?` · 🔁 ${au.length} automatique(s) : ${eur(au.reduce((a,c)=>a+c.budget,0))}/mois`:''}</div></div>
${vSpend()}
${S.cats.map((c,i)=>{const sp=spentOf(c),p=pct(sp,c.budget),col=p>100?'var(--bad)':p>=80?'var(--warn)':CAT[i%CAT.length];
return `<div class="stk"><div class="row"><div class="t">${esc(c.emoji)} ${esc(c.name)}</div><div class="pc">${p} %</div></div>
<div class="bar"><i style="width:${Math.min(100,p)}%;background-color:${col}"></i></div>
<div class="sm">${eur(sp)} / ${eur(c.budget)} · ${pct(c.budget,S.income)} % du revenu</div>${c.auto?`<span class="tag">🔁 automatique · le ${c.day||1} du mois · ${autoDue(c)?'déjà compté':'à venir'}</span>`:''}
<div class="acts"><button class="btn" data-act="spend" data-id="${c.id}">+ Dépense</button><button class="btn ghost" data-act="editcat" data-id="${c.id}">Modifier</button><button class="btn ghost" data-act="delcat" data-id="${c.id}" aria-label="Supprimer la catégorie">🗑️</button></div></div>`}).join('')}
<button class="btn full" data-act="newcat">+ Nouvelle catégorie</button><button class="btn ghost full" data-act="presets">✨ Catégories suggérées (maquillage, vêtements, resto…)</button><button class="btn full" data-act="wrap">✨ Mon wrapped du mois</button><button class="btn ghost full" data-act="newmonth">Nouveau mois (dépenses ponctuelles à 0)</button>`}
function saveCard(g){const T=th(g),p=pct(g.current,g.target);
 return `<div class="stk themed scard ${T.mood}" data-act="open" data-id="${g.id}" style="background-color:${T.s}"><div class="mini">${pig(T,p,'c'+g.id)}</div><div class="si"><div class="gt">${esc(g.emoji)} ${esc(g.name)}</div><div class="sm" style="color:#6b4a5a">${eur(g.current)} / ${eur(g.target)}</div><div class="bar"><i style="width:${Math.min(100,p)}%;background-color:${T.a}"></i></div></div><div class="pp">${p}%</div></div>`}
function proCard(g){const T=th(g),p=pct(g.current,g.target);
 return `<div class="pcard" data-act="open" data-id="${g.id}" style="background:${T.s}"><div class="ring" style="background:conic-gradient(${T.g} ${Math.min(100,p)*3.6}deg,rgba(0,0,0,.1) 0)"><div class="av">${esc(g.emoji)}</div></div><div class="pi"><div class="pn">${esc(g.name)}</div><div class="ps">${fmtG(g,g.current)} sur ${fmtG(g,g.target)}</div></div><div class="pg" style="color:${T.a}">${p}%</div></div>`}
function vGoals(k){const gs=S.goals.filter(g=>g.kind===k),s=k==='save';
 const sub=s?`${eur(gs.reduce((a,g)=>a+g.current,0))} de côté`:`${gs.filter(g=>g.current>=g.target).length} atteint(s) sur ${gs.length}`;
 return `${head(s?'Mes tirelires':'Mes objectifs pro',sub,s?'':'pf')}${gs.length?gs.map(s?saveCard:proCard).join(''):'<div class="empty note">Rien ici pour l’instant…</div>'}<button class="${s?'btn':'pbtn'} full" style="${s?'':'width:100%;margin-top:10px'}" data-act="newgoal" data-kind="${k}">+ Nouvel objectif</button>`}
function paceTxt(g){if(!g.deadline||g.current>=g.target)return '';const d=Math.ceil((new Date(g.deadline)-new Date())/864e5),s=g.kind==='save';
 if(d<=0)return 'Échéance dépassée';const rem=g.target-g.current,per=s?rem/Math.max(1,d/30):rem/Math.max(1,d/7);return `${d} jours restants · rythme conseillé : ${fmtG(g,Math.ceil(per*10)/10)} ${s?'par mois':'par semaine'}`}
const tools=(g,q,cls)=>`<div class="quick">${q.map(v=>`<button class="${cls}" data-act="add" data-v="${v}">+${v}</button>`).join('')}</div><div class="row" style="gap:8px"><input id="amt" inputmode="decimal" placeholder="Autre montant"><button class="${cls}" data-act="addc">Ajouter</button><button class="${cls==='btn'?'btn ghost':'pbtn g'}" data-act="subc">Retirer</button></div>`;
const logs=g=>g.log.length?`<div class="log">${g.log.slice(0,6).map(l=>`<div><span>${new Date(l.d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</span><b>${l.v>0?'+':''}${fmtG(g,l.v)}</b></div>`).join('')}</div>`:'';
function vSave(g){const T=th(g),p=pct(g.current,g.target);
 return `<button class="back" data-act="back">‹ Mes tirelires</button>
<div class="themed ${T.mood}" style="background-color:${T.s}"><div class="row"><div class="gt">${esc(g.emoji)} ${T.n}</div><div class="pp">${p} %</div></div>
<div class="pigbox">${pig(T,p,'d',view.from)}</div><div class="name">${esc(g.name)}</div><div class="amt">${eur(g.current)} <span class="note">sur ${eur(g.target)}</span></div>
<div class="bar"><i style="width:${Math.min(100,p)}%;background-color:${T.a}"></i></div>
<div class="note" style="text-align:center">${g.current>=g.target?'Objectif atteint ! 🎉':'Encore '+eur(g.target-g.current)+' et c’est gagné'}</div>
<div class="note" style="text-align:center">${paceTxt(g)}</div>${monthLine(g)}${tools(g,[5,20,50],'btn')}${logs(g)}</div>

function vPro(g){const T=th(g),p=pct(g.current,g.target),n=x=>(+x).toLocaleString('fr-FR');
 return `<button class="back" data-act="back">‹ Mes objectifs pro</button>
<div class="proc" style="background:${T.s}"><div class="ring big" style="background:conic-gradient(${T.g} ${Math.min(100,p)*3.6}deg,rgba(0,0,0,.1) 0)"><div class="av">${esc(g.emoji)}</div></div>
<div class="pname">${esc(g.name)}</div><div class="phandle">${g.current>=g.target?'OBJECTIF ATTEINT ✨':'EN COURS'} · ${T.n.toUpperCase()}</div>
<div class="pstats"><div><b>${n(g.current)}</b><span>${esc(g.unit)||'actuel'}</span></div><div><b>${n(g.target)}</b><span>objectif</span></div><div><b>${p}%</b><span>progression</span></div></div>
<div class="pbar"><i style="width:${Math.min(100,p)}%;background:linear-gradient(90deg,${T.g},${T.a})"></i></div>
<p class="sm" style="color:#2a2320;opacity:.7">${paceTxt(g)}</p>${monthLine(g)}${tools(g,[1,2,5],'pbtn')}${logs(g)}</div>
<button class="btn ghost full" data-act="editgoal">Modifier cet objectif</button>`}
function render(){const g=view.goal&&S.goals.find(x=>x.id===view.goal);
 $('#app').innerHTML=g?(g.kind==='save'?vSave(g):vPro(g)):view.tab==='budget'?vBudget():view.tab==='me'?vProfile():view.tab==='stars'?vStars():vGoals(view.tab);view.from=null;
 $('#nav').innerHTML=[['budget','📒','Budget'],['save','🐷','Tirelires'],['pro','💼','Pro'],['stars','⭐','Étoiles'],['me','🧸','Profil']].map(([t,i,l])=>`<button class="${view.tab===t?'on':''}" data-act="tab" data-t="${t}"><b>${i}</b>${l}</button>`).join('')}

/* formulaires */
function modal(title,body,onSave,onDel){const m=document.createElement('div');m.className='ov';
 m.innerHTML=`<div class="sheet"><h2>${title}</h2>${body}<div class="acts"><button class="btn" data-m="ok">Enregistrer</button>${onDel?'<button class="btn danger" data-m="del">Supprimer</button>':''}<button class="btn ghost" data-m="x">Annuler</button></div></div>`;
 m.addEventListener('click',e=>{const t=e.target;if(t===m||t.dataset.m==='x'){m.remove();return}
  const pk=t.closest('[data-pick]');if(pk){if(pk.dataset.multi)pk.classList.toggle('on');else{pk.parentNode.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('on'));pk.classList.add('on')}return}
  if(t.dataset.m==='ok'){onSave(m);m.remove()}
  if(t.dataset.m==='del'){if(t.dataset.armed){onDel();m.remove()}else{t.dataset.armed=1;t.textContent='Confirmer la suppression'}}});
 document.body.appendChild(m);const f=m.querySelector('[name=v]');if(f)f.focus()}
function goalForm(g){const L=g.kind==='save'?SAVE:PRO;return `<label>Nom<input name="name" value="${esc(g.name)}"></label>
<div class="two"><label>Actuel<input name="current" inputmode="decimal" value="${g.current}"></label><label>Objectif<input name="target" inputmode="decimal" value="${g.target}"></label></div>
${g.kind==='pro'?`<label>Unité (clients, abonnés, €…)<input name="unit" value="${esc(g.unit)}"></label>`:''}
<label>Échéance (facultatif)<input type="date" name="deadline" value="${g.deadline||''}"></label>
<label>⭐ Objectif du mois (facultatif, ${g.kind==='save'?'€ à mettre de côté':'à atteindre'} chaque mois)<input name="monthly" inputmode="decimal" value="${g.monthly||''}"></label>
<div class="lb">Emoji</div><div class="pk">${EMOJIS.map(e=>`<button type="button" class="chip ${e===g.emoji?'on':''}" data-pick="emoji" data-v="${e}">${e}</button>`).join('')}</div>
<div class="lb">Style</div><div class="pk">${L.map((t,i)=>`<button type="button" class="sw ${i===(g.theme||0)%L.length?'on':''}" data-pick="theme" data-v="${i}" aria-label="${t.n}" title="${t.n}" style="background:linear-gradient(135deg,${t.a} 50%,${t.s} 50%)"></button>`).join('')}</div>`}
function applyGoal(m,g){g.name=val(m,'name').trim()||g.name||'Objectif';g.current=num(val(m,'current'));g.target=num(val(m,'target'));if(g.kind==='pro')g.unit=val(m,'unit').trim();g.deadline=val(m,'deadline');g.monthly=num(val(m,'monthly'));g.emoji=pick(m,'emoji')||g.emoji;g.theme=+(pick(m,'theme')||g.theme||0);markReach(g)}
function catForm(c){return `<label>Nom<input name="name" value="${esc(c.name)}"></label><label>Emoji<input name="emoji" value="${esc(c.emoji)}"></label>
<div class="two"><label>Budget (€)<input name="budget" inputmode="decimal" value="${c.budget}"></label><label>Dépenses ponctuelles (€)<input name="spent" inputmode="decimal" value="${c.spent}"></label></div>
<label class="chk"><input type="checkbox" name="auto" ${c.auto?'checked':''}> 🔁 Dépense automatique chaque mois</label>
<label>Jour du mois (si automatique)<input name="day" inputmode="numeric" value="${c.day||1}"></label>`}
function applyCat(m,c){c.name=val(m,'name').trim()||'Catégorie';c.emoji=val(m,'emoji').trim()||'💸';c.budget=num(val(m,'budget'));c.spent=num(val(m,'spent'));c.auto=m.querySelector('[name=auto]').checked;c.day=Math.min(31,Math.max(1,Math.round(num(val(m,'day')))||1))}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.closest('.ov'))return;
 const a=b.dataset.act,id=b.dataset.id,g=S.goals.find(x=>x.id===(id||view.goal)),c=S.cats.find(x=>x.id===id);
 if(a==='tab'){view={tab:b.dataset.t,goal:null,from:null};render();scrollTo(0,0)}
 else if(a==='open'){view.goal=id;render();scrollTo(0,0)}
 else if(a==='back'){view.goal=null;render();scrollTo(0,0)}
 else if(a==='snd'){S.sound=!S.sound;save();render();clink()}
 else if(a==='poke'){const p=b.closest('svg');if(p.classList.contains('squish'))return;p.classList.add('squish');oink();setTimeout(()=>p.classList.remove('squish'),650)}
 else if(a==='delcat'&&c){if(b.dataset.armed){S.cats=S.cats.filter(x=>x!==c);commit()}else{b.dataset.armed=1;b.textContent='Supprimer ?'}}
 else if(a==='presets'){const ex=S.cats.map(x=>x.name.toLowerCase()),L=PRESETS.filter(p=>!ex.includes(p.name.toLowerCase()));
  modal('Catégories suggérées',L.length?`<div class="note">Coche celles que tu veux suivre, tu ajusteras les budgets ensuite.</div><div class="pk">${L.map((p,i)=>`<button type="button" class="chip" data-pick="pre" data-multi="1" data-v="${i}">${p.emoji} ${p.name}</button>`).join('')}</div>`:'<div class="note">Tu as déjà toutes les catégories suggérées !</div>',m=>{m.querySelectorAll('[data-pick="pre"].on').forEach(x=>{const p=L[+x.dataset.v];S.cats.push({id:uid(),name:p.name,emoji:p.emoji,budget:p.budget,spent:0})});commit()})}
 else if(a==='editprof'){const p=prof();modal('Mon profil',profForm(p),m=>{p.name=val(m,'name').trim();p.handle=val(m,'handle').trim().replace(/^@/,'');p.bio=val(m,'bio').trim();const rm=m.querySelector('[name=rmphoto]');if(rm&&rm.checked)p.photo='';const f=m.querySelector('[name=photo]').files[0];if(f)shrink(f,d=>{if(d)p.photo=d;commit()});else commit()})}
 else if(a==='wrap'){const k=mk();showWrapped(k,snap(k,false))}
 else if(a==='backup')modal('Sauvegarde',`<div class="note">Copie ce texte pour transférer tes données sur un autre appareil, ou colle une sauvegarde ici pour la restaurer.</div><textarea name="d" rows="7">${esc(JSON.stringify(S))}</textarea>`,m=>{try{const d=JSON.parse(val(m,'d'));if(d&&Array.isArray(d.cats)&&Array.isArray(d.goals)){S=d;commit();toast('Données restaurées ✨')}else toast('Sauvegarde invalide')}catch(e){toast('Sauvegarde invalide')}})
 else if(a==='income')modal('Revenu du mois',`<label>Montant (€)<input name="v" inputmode="decimal" value="${S.income}"></label>`,m=>{S.income=num(val(m,'v'));commit()});
 else if(a==='spend'&&c)modal(`Dépense · ${esc(c.name)}`,'<label>Montant (€), négatif pour corriger<input name="v" inputmode="decimal"></label>',m=>{c.spent=Math.max(0,Math.round((c.spent+num(val(m,'v')))*100)/100);commit()});
 else if(a==='editcat'&&c)modal('Modifier la catégorie',catForm(c),m=>{applyCat(m,c);commit()},()=>{S.cats=S.cats.filter(x=>x!==c);commit()});
 else if(a==='newcat'){const n={id:uid(),name:'',emoji:'🛍️',budget:100,spent:0};modal('Nouvelle catégorie',catForm(n),m=>{applyCat(m,n);S.cats.push(n);commit()})}
 else if(a==='newmonth'){if(b.dataset.armed){S.cats.forEach(x=>x.spent=0);commit()}else{b.dataset.armed=1;b.textContent='Confirmer : tout remettre à 0'}}
 else if(a==='newgoal'){const k=b.dataset.kind,s=k==='save',n={id:uid(),kind:k,name:'',emoji:s?'🎯':'💼',theme:0,current:0,target:s?1000:10,unit:s?'€':'clients',deadline:'',log:[]};
  modal('Nouvel objectif',goalForm(n),m=>{applyGoal(m,n);S.goals.push(n);commit()})}
 else if(a==='editgoal'&&g)modal('Modifier l’objectif',goalForm(g),m=>{applyGoal(m,g);commit()},()=>{S.goals=S.goals.filter(x=>x!==g);view.goal=null;commit()});
 else if(a==='add'&&g)adjust(g,+b.dataset.v);
 else if(a==='addc'&&g)adjust(g,Math.abs(num($('#amt').value)));
 else if(a==='subc'&&g)adjust(g,-Math.abs(num($('#amt').value)));
});
const rk=rollover();render();
{let wk=null,wd=null;if(rk&&S.wrapSeen!==rk){wk=rk;wd=S.hist[rk]}else if(isLast()&&S.wrapSeen!==mk()){wk=mk();wd=snap(mk(),false)}
if(wk){S.wrapSeen=wk;save();setTimeout(()=>showWrapped(wk,wd),600)}}
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
